name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release ZIP
        run: |
          mkdir -p build
          rsync -a --exclude-from=.distignore . build/wp-ai-chatbot/
          cd build
          zip -r "../wp-ai-chatbot-${{ steps.version.outputs.version }}.zip" wp-ai-chatbot/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wp-ai-chatbot-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
