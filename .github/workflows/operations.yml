name: Operations

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Dependency Vulnerability Audit ─────────────────────────────────────────
  audit-npm:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit (high+critical)
        run: npm audit --audit-level=high

  audit-composer:
    name: Composer Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          sudo mv composer.phar /usr/local/bin/composer

      - name: Install dependencies (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Run composer audit
        run: composer audit --no-dev

  # ── Scheduled Smoke Test ────────────────────────────────────────────────────
  smoke-test:
    name: Health Endpoint Smoke Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli, curl, json, mbstring, openssl

      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Set up WordPress
        run: |
          mkdir -p /tmp/wordpress
          cd /tmp/wordpress
          wp core download --allow-root
          wp config create \
            --dbname=wordpress_smoke \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1 \
            --allow-root
          wp core install \
            --url=http://localhost:8080 \
            --title="Smoke Test" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=admin@test.local \
            --allow-root

      - name: Link plugin
        run: |
          ln -s "$GITHUB_WORKSPACE" /tmp/wordpress/wp-content/plugins/wp-ai-chatbot
          cd /tmp/wordpress
          wp plugin activate wp-ai-chatbot --allow-root

      - name: Start WordPress server
        run: |
          cd /tmp/wordpress
          nohup php -S localhost:8080 > /tmp/wp-server.log 2>&1 &
          sleep 2
          curl -sf http://localhost:8080/index.php > /dev/null || {
            cat /tmp/wp-server.log
            exit 1
          }

      - name: Smoke — health endpoint returns healthy
        run: |
          response=$(curl -sf "http://localhost:8080/index.php?rest_route=/wp-ai-chatbot/v1/health")
          echo "$response" | jq .
          echo "$response" | jq -e '.status == "healthy"'
          echo "$response" | jq -e '.checks.php.status == "pass"'
          echo "$response" | jq -e '.checks.database.status == "pass"'

      - name: Smoke — unauthenticated admin endpoints return 401/403
        run: |
          # Chat endpoint (no session) — expect 400 (missing required params) or 401
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "http://localhost:8080/index.php?rest_route=/wp-ai-chatbot/v1/chat")
          echo "POST /chat unauthenticated: HTTP $code"
          [ "$code" = "400" ] || [ "$code" = "401" ] || [ "$code" = "403" ]

          # Backup export (admin only) — expect 403
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://localhost:8080/index.php?rest_route=/wp-ai-chatbot/v1/backup/export")
          echo "GET /backup/export unauthenticated: HTTP $code"
          [ "$code" = "403" ]

      - name: Server logs on failure
        if: failure()
        run: cat /tmp/wp-server.log 2>/dev/null || true

  # ── PHP Unit Tests (weekly full matrix) ────────────────────────────────────
  php-test-matrix:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json, mbstring

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          sudo mv composer.phar /usr/local/bin/composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=never
